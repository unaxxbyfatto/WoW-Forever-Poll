<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Poll</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #f0f0f0;
            text-align: center;
            padding: 30px 15px;
            margin: 0;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            border: 1px solid #383838;
        }
        h2 {
            color: #f8b700;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 25px;
        }
        .card-btn {
            background-color: #262626;
            color: #fff;
            border: 2px solid #555;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 135px;
        }
        .card-btn:hover {
            border-color: #f8b700;
            background-color: #303030;
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(248, 183, 0, 0.25);
        }
        .card-btn span {
            margin-top: 12px;
            font-weight: bold;
            font-size: 14px;
            color: #f0f0f0;
            line-height: 1.2;
        }
        .icon-box {
            border-radius: 6px;
            background-repeat: no-repeat;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }
        button.action-btn {
            background-color: #f8b700;
            color: #121212;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.action-btn:hover {
            background-color: #ffca2c;
            transform: scale(1.03);
        }
        button.back-btn {
            border: 1px solid #666;
            background-color: transparent;
            color: #aaa;
            margin-top: 25px;
            font-size: 14px;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
        }
        button.back-btn:hover {
            border-color: #aaa;
            color: #fff;
            background-color: #333;
        }
        input[type="text"] {
            padding: 12px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 2px solid #555;
            background-color: #2c2c2c;
            color: #fff;
            width: 75%;
            max-width: 300px;
            margin-bottom: 20px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #f8b700;
        }
        .result-images {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .result-card {
            background: #262626;
            padding: 18px;
            border-radius: 10px;
            border: 2px solid #f8b700;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 140px;
        }
        .result-card p {
            margin: 12px 0 0 0;
            font-weight: bold;
            font-size: 15px;
            color: #f8b700;
        }
        .saved-list {
            margin-top: 40px;
            text-align: left;
            background: #161616;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .saved-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .saved-list-header h3 {
            margin: 0;
            color: #f8b700;
        }
        .clear-btn {
            background: transparent;
            border: 1px solid #555;
            color: #888;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .clear-btn:hover {
            color: #ff5555;
            border-color: #ff5555;
        }
        .saved-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #262626;
        }
        .saved-item:last-child {
            border-bottom: none;
        }
        .saved-icons {
            display: flex;
            gap: 8px;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- STEG 1: FACTION -->
    <div id="step-faction" class="step active">
        <h2>Step 1: Choose Faction</h2>
        <div id="faction-options" class="options-grid"></div>
    </div>

    <!-- STEG 2: RACE -->
    <div id="step-race" class="step">
        <h2>Step 2: Choose Race</h2>
        <div id="race-options" class="options-grid"></div>
        <button class="back-btn" onclick="showStep('step-faction')">← Back</button>
    </div>

    <!-- STEG 3: CLASS -->
    <div id="step-class" class="step">
        <h2>Step 3: Choose Class</h2>
        <div id="class-options" class="options-grid"></div>
        <button class="back-btn" onclick="showStep('step-race')">← Back</button>
    </div>

    <!-- STEG 4: NAME -->
    <div id="step-name" class="step">
        <h2>What is your name?</h2>
        <div>
            <input type="text" id="player-name" placeholder="Enter your name..." />
        </div>
        <button class="action-btn" onclick="submitPoll()">Save & Show Result</button>
        <br>
        <button class="back-btn" onclick="showStep('step-class')">← Back</button>
    </div>

    <!-- STEG 5: RESULTAT -->
    <div id="step-result" class="step">
        <h2 id="result-title">Your Character</h2>
        
        <div class="result-images">
            <div class="result-card">
                <div id="res-img-faction"></div>
                <p id="txt-faction"></p>
            </div>
            <div class="result-card">
                <div id="res-img-race"></div>
                <p id="txt-race"></p>
            </div>
            <div class="result-card">
                <div id="res-img-class"></div>
                <p id="txt-class"></p>
            </div>
        </div>

        <button class="action-btn" onclick="resetPoll()">Add Another Person</button>

        <div class="saved-list">
            <div class="saved-list-header">
                <h3>All Saved Characters</h3>
                <button class="clear-btn" onclick="clearSavedEntries()">Clear List</button>
            </div>
            <div id="entries-container"></div>
        </div>
    </div>
</div>

<script>
    // Exakta regler för valen
    const racesByFaction = {
        "Alliance": ["Human", "Dwarf", "Night Elf", "Gnome", "High Order Skyborne"],
        "Horde": ["Orc", "Undead", "Tauren", "Troll", "Windshaper Skyborne"]
    };

    const classesByRace = {
        "Orc": ["Warrior", "Hunter", "Mage", "Rogue", "Warlock", "Shaman"],
        "Undead": ["Warrior", "Mage", "Rogue", "Priest", "Warlock", "Paladin"],
        "Tauren": ["Warrior", "Hunter", "Druid", "Shaman"],
        "Troll": ["Warrior", "Hunter", "Mage", "Rogue", "Priest", "Warlock", "Shaman"],
        "Windshaper Skyborne": ["Warrior", "Hunter", "Rogue", "Druid", "Shaman"],
        "Human": ["Warrior", "Hunter", "Mage", "Rogue", "Priest", "Warlock", "Paladin"],
        "Dwarf": ["Warrior", "Hunter", "Rogue", "Priest", "Paladin", "Shaman"],
        "Night Elf": ["Warrior", "Hunter", "Rogue", "Priest", "Druid"],
        "Gnome": ["Warrior", "Mage", "Rogue", "Priest", "Warlock"],
        "High Order Skyborne": ["Warrior", "Hunter", "Mage", "Rogue", "Druid"]
    };

    // Exakta koordinater för att klippa ut rätt porträtt/ikon ur dina 7 bilder
    const SPRITES = {
        // Factions
        "Horde":    { file: "horde.png",    w: 112, h: 100, x: 0, y: 0, bgW: 112, bgH: 100 },
        "Alliance": { file: "alliance.png", w: 112, h: 102, x: 0, y: 0, bgW: 112, bgH: 102 },

        // Alliance Races (alliance_races.png: 77x444)
        "Human":               { file: "alliance_races.png", w: 77, h: 80, x: 0, y: 0,   bgW: 77, bgH: 444 },
        "Dwarf":               { file: "alliance_races.png", w: 77, h: 80, x: 0, y: 90,  bgW: 77, bgH: 444 },
        "Night Elf":           { file: "alliance_races.png", w: 77, h: 80, x: 0, y: 180, bgW: 77, bgH: 444 },
        "Gnome":               { file: "alliance_races.png", w: 77, h: 80, x: 0, y: 270, bgW: 77, bgH: 444 },
        "High Order Skyborne": { file: "alliance_races.png", w: 77, h: 84, x: 0, y: 360, bgW: 77, bgH: 444 },

        // Horde Races (horde_races.png: 74x438)
        "Orc":                 { file: "horde_races.png", w: 74, h: 78, x: 0, y: 0,   bgW: 74, bgH: 438 },
        "Undead":              { file: "horde_races.png", w: 74, h: 78, x: 0, y: 90,  bgW: 74, bgH: 438 },
        "Tauren":              { file: "horde_races.png", w: 74, h: 78, x: 0, y: 180, bgW: 74, bgH: 438 },
        "Troll":               { file: "horde_races.png", w: 74, h: 78, x: 0, y: 270, bgW: 74, bgH: 438 },
        "Windshaper Skyborne": { file: "horde_races.png", w: 74, h: 78, x: 0, y: 360, bgW: 74, bgH: 438 },

        // Classes 1 (classes1.png: 299x81)
        "Warrior": { file: "classes1.png", w: 60, h: 58, x: 0,   y: 0, bgW: 299, bgH: 81 },
        "Hunter":  { file: "classes1.png", w: 60, h: 58, x: 79,  y: 0, bgW: 299, bgH: 81 },
        "Mage":    { file: "classes1.png", w: 64, h: 60, x: 155, y: 0, bgW: 299, bgH: 81 },
        "Rogue":   { file: "classes1.png", w: 60, h: 58, x: 237, y: 0, bgW: 299, bgH: 81 },

        // Classes 2 (classes2.png: 223x80)
        "Priest":  { file: "classes2.png", w: 60, h: 58, x: 2,   y: 0, bgW: 223, bgH: 80 },
        "Warlock": { file: "classes2.png", w: 60, h: 58, x: 81,  y: 0, bgW: 223, bgH: 80 },
        "Paladin": { file: "classes2.png", w: 60, h: 58, x: 160, y: 0, bgW: 223, bgH: 80 },

        // Classes 3 (classes3.png: 147x81)
        "Druid":   { file: "classes3.png", w: 60, h: 58, x: 3,   y: 1, bgW: 147, bgH: 81 },
        "Shaman":  { file: "classes3.png", w: 60, h: 58, x: 83,  y: 1, bgW: 147, bgH: 81 }
    };

    // Skapar ett bild-element skalat till önskad storlek
    function createSpriteHTML(key, targetSize = 85) {
        const s = SPRITES[key];
        if (!s) return '';
        const scale = targetSize / s.w;
        const finalW = Math.round(s.w * scale);
        const finalH = Math.round(s.h * scale);
        const bgW = Math.round(s.bgW * scale);
        const bgH = Math.round(s.bgH * scale);
        const posX = -Math.round(s.x * scale);
        const posY = -Math.round(s.y * scale);

        return `<div class="icon-box" style="
            width: ${finalW}px;
            height: ${finalH}px;
            background-image: url('${s.file}');
            background-position: ${posX}px ${posY}px;
            background-size: ${bgW}px ${bgH}px;
        " title="${key}"></div>`;
    }

    let currentSelection = {
        faction: "",
        race: "",
        charClass: "",
        name: ""
    };

    // Initiera Steg 1 (Factions)
    function initFactions() {
        const factionContainer = document.getElementById('faction-options');
        factionContainer.innerHTML = '';
        ["Alliance", "Horde"].forEach(faction => {
            const btn = document.createElement('div');
            btn.className = 'card-btn';
            btn.onclick = () => selectFaction(faction);
            btn.innerHTML = `${createSpriteHTML(faction, 95)}<span>${faction}</span>`;
            factionContainer.appendChild(btn);
        });
    }

    function selectFaction(faction) {
        currentSelection.faction = faction;
        const raceContainer = document.getElementById('race-options');
        raceContainer.innerHTML = '';

        racesByFaction[faction].forEach(race => {
            const btn = document.createElement('div');
            btn.className = 'card-btn';
            btn.onclick = () => selectRace(race);
            btn.innerHTML = `${createSpriteHTML(race, 80)}<span>${race}</span>`;
            raceContainer.appendChild(btn);
        });

        showStep('step-race');
    }

    function selectRace(race) {
        currentSelection.race = race;
        const classContainer = document.getElementById('class-options');
        classContainer.innerHTML = '';

        classesByRace[race].forEach(charClass => {
            const btn = document.createElement('div');
            btn.className = 'card-btn';
            btn.onclick = () => selectClass(charClass);
            btn.innerHTML = `${createSpriteHTML(charClass, 75)}<span>${charClass}</span>`;
            classContainer.appendChild(btn);
        });

        showStep('step-class');
    }

    function selectClass(charClass) {
        currentSelection.charClass = charClass;
        showStep('step-name');
    }

    function submitPoll() {
        const nameInput = document.getElementById('player-name').value.trim();
        if (!nameInput) {
            alert("Please enter your name!");
            return;
        }
        currentSelection.name = nameInput;

        // Visa resultat och ikoner
        document.getElementById('result-title').textContent = `${currentSelection.name}'s Character`;
        
        document.getElementById('txt-faction').textContent = currentSelection.faction;
        document.getElementById('res-img-faction').innerHTML = createSpriteHTML(currentSelection.faction, 95);

        document.getElementById('txt-race').textContent = currentSelection.race;
        document.getElementById('res-img-race').innerHTML = createSpriteHTML(currentSelection.race, 95);

        document.getElementById('txt-class').textContent = currentSelection.charClass;
        document.getElementById('res-img-class').innerHTML = createSpriteHTML(currentSelection.charClass, 95);

        saveEntry(currentSelection);
        renderSavedEntries();

        showStep('step-result');
    }

    function saveEntry(entry) {
        const saved = JSON.parse(localStorage.getItem('wowPollEntries') || '[]');
        saved.push(entry);
        localStorage.setItem('wowPollEntries', JSON.stringify(saved));
    }

    function renderSavedEntries() {
        const container = document.getElementById('entries-container');
        const saved = JSON.parse(localStorage.getItem('wowPollEntries') || '[]');
        
        if (saved.length === 0) {
            container.innerHTML = '<p style="color:#777;">No characters saved yet.</p>';
            return;
        }

        container.innerHTML = saved.map(item => `
            <div class="saved-item">
                <div>
                    <strong style="color:#f8b700;">${item.name}</strong> — ${item.faction} | ${item.race} ${item.charClass}
                </div>
                <div class="saved-icons">
                    ${createSpriteHTML(item.faction, 34)}
                    ${createSpriteHTML(item.race, 34)}
                    ${createSpriteHTML(item.charClass, 34)}
                </div>
            </div>
        `).join('');
    }

    function clearSavedEntries() {
        if (confirm("Are you sure you want to clear all saved characters?")) {
            localStorage.removeItem('wowPollEntries');
            renderSavedEntries();
        }
    }

    function resetPoll() {
        currentSelection = { faction: "", race: "", charClass: "", name: "" };
        document.getElementById('player-name').value = '';
        showStep('step-faction');
    }

    function showStep(stepId) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    // Starta igång första steget
    initFactions();
</script>

</body>
</html>
