<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Character Creation Poll</title>
    <!-- Googles 3D-motor för .glb/.gltf-modeller -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* YOUTUBE BAKGRUND */
        .video-background {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2; overflow: hidden; pointer-events: none;
        }
        .video-background iframe {
            position: absolute; top: 50%; left: 50%;
            width: 100vw; height: 56.25vw;
            min-height: 100vh; min-width: 177.77vh;
            transform: translate(-50%, -50%); border: 0;
        }
        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 20%, rgba(0,0,0,0.65) 100%);
            z-index: -1; pointer-events: none;
        }

        /* 3D-SCEN I MITTEN */
        #center-stage {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        model-viewer {
            width: 100%;
            height: 78vh;
            margin-top: -6vh;
            --poster-color: transparent;
            outline: none;
            cursor: grab;
        }
        model-viewer:active {
            cursor: grabbing;
        }
        .rotate-hint {
            position: absolute;
            bottom: 228px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #6b5a3e;
            color: #ffd100;
            font-size: 12px;
            padding: 5px 16px;
            border-radius: 15px;
            pointer-events: none;
            z-index: 5;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        /* VÄNSTER SIDA: ALLIANCE & HORDE BANNERS */
        .left-banners {
            position: absolute;
            top: 15px; left: 20px;
            display: flex; gap: 14px;
            z-index: 10;
        }
        .banner {
            width: 82px;
            padding: 12px 6px 28px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: 2px solid #7c6c4f;
            border-top: none;
            clip-path: polygon(0 0, 100% 0, 100% 93%, 50% 100%, 0 93%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }
        .banner.alliance {
            background: linear-gradient(180deg, #163a70 0%, #0d2346 85%, #07152b 100%);
        }
        .banner.horde {
            background: linear-gradient(180deg, #6b1515 0%, #450b0b 85%, #240505 100%);
        }
        .banner-title {
            font-size: 11px;
            font-weight: bold;
            color: #ffd100;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-shadow: 0 2px 3px #000;
        }
        .race-slot {
            padding: 2px;
            border: 2px solid #5a4b32;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            background: #111;
        }
        .race-slot:hover {
            border-color: #bca676;
            transform: scale(1.05);
        }
        .race-slot.selected {
            border-color: #fff3a1;
            box-shadow: 0 0 14px #ffd100, 0 0 6px #ffffff;
            transform: scale(1.07);
        }

        /* HÖGST UPP I MITTEN: KÖN (MALE / FEMALE) */
        .gender-bar {
            position: absolute;
            top: 16px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 8px;
            background: rgba(15, 13, 10, 0.88);
            padding: 6px;
            border: 2px solid #6e5e43;
            border-radius: 8px;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .gender-btn {
            width: 44px; height: 44px;
            background: #25221e;
            border: 2px solid #554833;
            border-radius: 5px;
            color: #888;
            font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: 0.15s;
        }
        .gender-btn.selected {
            border-color: #fff3a1;
            color: #ffd100;
            background: #3a3222;
            box-shadow: 0 0 10px #ffd100;
        }

        /* HÖGER SIDA: 3 INFO-PANELER (FACTION, RACE, CLASS) */
        .right-panels {
            position: absolute;
            top: 15px; right: 20px;
            width: 310px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
            max-height: calc(100vh - 110px);
        }
        .wow-box {
            background: rgba(18, 15, 12, 0.88);
            border: 2px solid #6e5e43;
            border-radius: 6px;
            padding: 12px 14px 12px 20px;
            position: relative;
            box-shadow: 0 6px 20px rgba(0,0,0,0.85);
            text-align: left;
            flex: 1;
            overflow-y: auto;
        }
        .wow-box::-webkit-scrollbar { width: 5px; }
        .wow-box::-webkit-scrollbar-thumb { background: #6e5e43; border-radius: 3px; }
        .wow-box h3 {
            margin: 0 0 6px 0;
            color: #ffffff;
            font-size: 16px;
            text-shadow: 0 1px 3px #000;
        }
        .wow-box .sub-label {
            color: #ffd100;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
            display: block;
        }
        .wow-box p {
            margin: 0;
            color: #e5c687;
            font-size: 12.5px;
            line-height: 1.45;
        }
        .trait-item {
            margin-bottom: 8px;
            font-size: 12px;
            color: #d8c090;
            line-height: 1.35;
        }
        .trait-item strong {
            color: #ffffff;
        }

        /* SPEC BAR (OVANFÖR ROLE BAR) */
        .spec-bar {
            position: absolute;
            bottom: 168px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(16, 14, 11, 0.92);
            padding: 7px 18px;
            border: 2px solid #6e5e43;
            border-radius: 8px;
            z-index: 10;
            box-shadow: 0 6px 20px rgba(0,0,0,0.9);
            white-space: nowrap;
        }

        /* ROLE BAR (OVANFÖR CLASS BAR) */
        .role-bar {
            position: absolute;
            bottom: 112px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(16, 14, 11, 0.92);
            padding: 7px 18px;
            border: 2px solid #6e5e43;
            border-radius: 8px;
            z-index: 10;
            box-shadow: 0 6px 20px rgba(0,0,0,0.9);
            white-space: nowrap;
        }
        .role-bar-label {
            color: #e5c687;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 4px;
        }
        .role-slot {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 4px 10px;
            border: 2px solid #5a4b32;
            border-radius: 6px;
            background: #181512;
            cursor: pointer;
            transition: all 0.15s;
        }
        .role-slot:hover:not(.disabled) {
            border-color: #d6be8a;
            transform: translateY(-2px);
        }
        .role-slot.selected {
            border-color: #fff3a1;
            background: #2f2719;
            box-shadow: 0 0 12px #ffd100;
        }
        .role-slot span {
            font-size: 12px;
            font-weight: bold;
            color: #ffd100;
        }
        .role-slot.disabled {
            filter: grayscale(100%) brightness(35%);
            cursor: not-allowed;
        }
        .role-icon-img {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            object-fit: cover;
            display: block;
            background: #222;
        }

        /* SLUMP-KNAPP FÖR SPEC/ROLL (SNURR & GLÖD) */
        .random-role-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border: 2px dashed #ffd100;
            border-radius: 6px;
            background: #231d14;
            cursor: pointer;
            transition: all 0.15s;
            margin-left: 4px;
        }
        .random-role-btn:hover {
            background: #382e1e;
            border-color: #fff3a1;
            transform: scale(1.05);
        }
        .random-role-btn span {
            font-size: 11px;
            font-weight: bold;
            color: #fff3a1;
        }
        @keyframes spinRoleIcon {
            0%   { transform: rotate(0deg) scale(1); }
            50%  { transform: rotate(540deg) scale(1.25); }
            100% { transform: rotate(1080deg) scale(1); }
        }
        .spin-anim {
            animation: spinRoleIcon 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        @keyframes roleWinnerGlow {
            0%, 100% { box-shadow: 0 0 12px #ffd100; border-color: #fff3a1; }
            50%      { box-shadow: 0 0 28px #00ffcc, 0 0 15px #ffffff; border-color: #00ffcc; transform: scale(1.1); }
        }
        .role-slot.winner-glow {
            animation: roleWinnerGlow 0.6s ease-in-out 3;
        }

        /* LÄNGST NER I MITTEN: CLASS BAR */
        .bottom-class-bar {
            position: absolute;
            bottom: 14px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 10px;
            background: rgba(16, 14, 11, 0.92);
            padding: 10px 16px;
            border: 2px solid #6e5e43;
            border-radius: 8px;
            z-index: 10;
            box-shadow: 0 8px 25px rgba(0,0,0,0.95);
        }
        .class-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 58px;
            transition: all 0.15s;
        }
        .class-icon-wrap {
            padding: 2px;
            border: 2px solid #5a4b32;
            border-radius: 6px;
            background: #111;
            transition: 0.15s;
        }
        .class-slot:hover:not(.disabled) .class-icon-wrap {
            border-color: #d6be8a;
            transform: translateY(-2px);
        }
        .class-slot.selected .class-icon-wrap {
            border-color: #fff3a1;
            box-shadow: 0 0 14px #ffd100, 0 0 6px #fff;
            transform: scale(1.06);
        }
        .class-slot span {
            margin-top: 5px;
            font-size: 11px;
            color: #ffd100;
            font-weight: bold;
            text-shadow: 0 1px 2px #000;
        }
        .class-slot.disabled {
            filter: grayscale(100%) brightness(38%);
            cursor: not-allowed;
        }
        .class-slot.disabled span {
            color: #777;
        }

        /* RÖDA WOW-KNAPPAR I NEDRE HÖRNEN */
        .wow-red-btn {
            position: absolute;
            bottom: 22px;
            background: linear-gradient(180deg, #9b1c1c 0%, #630d0d 100%);
            color: #ffd100;
            border: 2px solid #8c7853;
            border-radius: 5px;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
            text-shadow: 0 2px 3px #000;
            transition: 0.15s;
        }
        .wow-red-btn:hover {
            background: linear-gradient(180deg, #bd2424 0%, #7d1212 100%);
            color: #ffffff;
            border-color: #ffd100;
        }
        .btn-left { left: 24px; }
        .btn-right { right: 24px; }

        /* LJUDKNAPP */
        .sound-btn {
            position: absolute;
            top: 18px; left: 215px;
            background: rgba(18, 15, 12, 0.85);
            color: #ffd100;
            border: 1px solid #6e5e43;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            z-index: 10;
        }
        .sound-btn:hover { border-color: #ffd100; }

        /* BLINKANDE "BUY CHEAP GOLD" RICKROLL-KNAPP */
        .cheap-gold-btn {
            position: absolute;
            top: 54px;
            left: 215px;
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            color: #1a0f00;
            border: 2px solid #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 900;
            text-decoration: none;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 50;
            box-shadow: 0 0 15px #ffd700;
            animation: goldBlink 0.75s infinite alternate;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .cheap-gold-btn:hover {
            animation: none;
            transform: scale(1.08);
            background: linear-gradient(180deg, #fff066 0%, #ffa500 100%);
            box-shadow: 0 0 25px #ffd700, 0 0 10px #ffffff;
        }
        @keyframes goldBlink {
            0% {
                transform: scale(1);
                box-shadow: 0 0 8px #ffd700, 0 0 4px #ff0000;
                border-color: #ffd700;
            }
            100% {
                transform: scale(1.06);
                box-shadow: 0 0 22px #ffea00, 0 0 14px #ff3300;
                border-color: #ffffff;
                background: linear-gradient(180deg, #ffffff 0%, #ffd700 100%);
            }
        }

        .icon-box {
            border-radius: 4px;
            background-repeat: no-repeat;
            display: block;
            flex-shrink: 0;
        }

        /* MODAL FÖR NAMN, SPARA, LISTA & STATISTIK */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.84);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #181512;
            border: 2px solid #8c7853;
            border-radius: 8px;
            width: 92%;
            max-width: 720px;
            padding: 22px;
            box-shadow: 0 10px 40px #000;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box::-webkit-scrollbar { width: 6px; }
        .modal-box::-webkit-scrollbar-thumb { background: #6e5e43; border-radius: 3px; }
        .modal-box h2 { color: #ffd100; margin-top: 0; margin-bottom: 10px; }
        .name-input {
            padding: 10px 14px;
            font-size: 16px;
            background: #0d0b09;
            border: 2px solid #6e5e43;
            color: #fff;
            border-radius: 5px;
            width: 75%;
            max-width: 340px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }
        .name-input:focus { border-color: #ffd100; }

        /* FLIK-KNAPPAR I MODALEN */
        .modal-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: #252019;
            color: #c9b182;
            border: 1px solid #6e5e43;
            padding: 8px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.15s;
        }
        .tab-btn.active {
            background: #ffd100;
            color: #121212;
            border-color: #fff3a1;
        }

        .saved-list {
            text-align: left;
            background: #0e0c0a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #3a3225;
            max-height: 350px;
            overflow-y: auto;
        }
        .saved-list::-webkit-scrollbar { width: 5px; }
        .saved-list::-webkit-scrollbar-thumb { background: #6e5e43; border-radius: 3px; }
        .saved-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #221d17;
            font-size: 14px;
        }
        .saved-item:last-child { border-bottom: none; }
        .saved-icons { display: flex; gap: 6px; align-items: center; }

        /* STATISTIK-SEKTION */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            text-align: left;
        }
        .stat-card {
            background: #14110e;
            border: 1px solid #4a3e2b;
            border-radius: 6px;
            padding: 12px;
        }
        .stat-card h4 {
            margin: 0 0 10px 0;
            color: #ffd100;
            font-size: 13px;
            text-transform: uppercase;
            border-bottom: 1px solid #2e261b;
            padding-bottom: 5px;
        }
        .stat-row {
            margin-bottom: 8px;
            font-size: 12px;
        }
        .stat-row-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
            color: #e5c687;
        }
        .stat-bar-bg {
            width: 100%;
            height: 8px;
            background: #26211b;
            border-radius: 4px;
            overflow: hidden;
        }
        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #b8860b, #ffd100);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* ================= MOBILANPASSNING (SKÄRMAR UNDER 900px) ================= */
        @media (max-width: 900px) {
            body {
                overflow-y: auto;
                overflow-x: hidden;
                height: auto;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding-top: 46px;
                padding-bottom: 90px;
                gap: 12px;
            }
            .sound-btn {
                position: fixed;
                top: 8px;
                left: 8px;
                z-index: 60;
                font-size: 11px;
                padding: 5px 10px;
            }
            .cheap-gold-btn {
                position: fixed;
                top: 8px;
                right: 8px;
                left: auto;
                font-size: 10px;
                padding: 5px 10px;
                z-index: 60;
            }
            .gender-bar {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                order: 1;
            }
            #center-stage {
                position: relative;
                top: auto;
                left: auto;
                width: 100%;
                height: 340px;
                order: 2;
            }
            model-viewer {
                height: 330px;
                margin-top: 0;
            }
            .rotate-hint {
                bottom: 8px !important;
                font-size: 11px;
                padding: 4px 12px;
                width: 90%;
                text-align: center;
                white-space: normal;
            }
            .left-banners {
                position: relative;
                top: auto;
                left: auto;
                order: 3;
                justify-content: center;
                gap: 12px;
                width: 100%;
            }
            .banner {
                width: 155px;
                padding: 10px 8px 22px 8px;
            }
            #alliance-races-list, #horde-races-list {
                display: flex !important;
                flex-direction: row !important;
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px !important;
            }
            .spec-bar {
                position: relative;
                bottom: auto;
                left: auto;
                transform: none;
                order: 4;
                width: 94%;
                max-width: 440px;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                padding: 8px 10px;
                white-space: normal;
            }
            .role-bar {
                position: relative;
                bottom: auto;
                left: auto;
                transform: none;
                order: 5;
                width: 94%;
                max-width: 440px;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                padding: 8px 10px;
                white-space: normal;
            }
            .role-bar-label {
                width: 100%;
                text-align: center;
                margin-right: 0;
                margin-bottom: 2px;
            }
            .bottom-class-bar {
                position: relative;
                bottom: auto;
                left: auto;
                transform: none;
                order: 6;
                width: 94%;
                max-width: 440px;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                padding: 10px;
            }
            .class-slot {
                width: 52px;
            }
            .right-panels {
                position: relative;
                top: auto;
                right: auto;
                order: 7;
                width: 94%;
                max-width: 440px;
                max-height: none;
            }
            .wow-box {
                max-height: none;
            }
            .wow-red-btn.btn-left,
            .wow-red-btn.btn-right {
                position: fixed;
                bottom: 10px;
                width: calc(50% - 14px);
                padding: 12px 6px;
                font-size: 13px;
                z-index: 60;
                text-align: center;
            }
            .wow-red-btn.btn-left { left: 8px; }
            .wow-red-btn.btn-right { right: 8px; }
            .stats-grid { grid-template-columns: 1fr; }
            .modal-box {
                width: 95%;
                padding: 16px 12px;
                max-height: 92vh;
            }
            .name-input { width: 92%; }
            .saved-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
        }
    </style>
</head>
<body>

<!-- YOUTUBE BAKGRUNDSVIDEO -->
<div class="video-background">
    <div id="yt-player"></div>
</div>
<div class="video-overlay"></div>

<!-- LJUDKNAPP & RICKROLL GULD-KNAPP -->
<button id="music-btn" class="sound-btn" onclick="toggleSound(event)">🔇 Enable Sound</button>
<a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="cheap-gold-btn">
    🪙 Buy Cheap Gold, 25% off original price!
</a>

<!-- HÖGST UPP: KÖNSVAL -->
<div class="gender-bar">
    <div id="gender-male" class="gender-btn selected" onclick="selectGender('Male')" title="Male">♂</div>
    <div id="gender-female" class="gender-btn" onclick="selectGender('Female')" title="Female">♀</div>
</div>

<!-- VÄNSTER: ALLIANCE & HORDE BANNERS -->
<div class="left-banners">
    <div class="banner alliance">
        <div id="logo-alliance"></div>
        <div class="banner-title">ALLIANCE</div>

        const viewer = document.getElementById('char-3d-viewer');

        const gender = currentSelection.gender.toLowerCase();
        const fileName = `${cfg.filePrefix}${gender}_hd.glb`;

        const primaryUrl = `${HF_BASE_URL}/character/${cfg.folder}/${gender}/${fileName}`;
        const secondaryUrl = cfg.altFolder
            ? `${HF_BASE_URL}/character/${cfg.altFolder}/${gender}/${fileName}`
            : null;

        statusText.textContent = `⏳ Loading 3D Model: ${currentSelection.race} (${currentSelection.gender})...`;
        viewer.src = primaryUrl;

        viewer.onload = () => {
            if (viewer.src !== FALLBACK_3D_MODEL) {
                statusText.textContent = `🖱️ ${currentSelection.race} (${currentSelection.gender}) — Drag with mouse to rotate`;
            }
        };

        viewer.onerror = () => {
            if (secondaryUrl && viewer.src === primaryUrl) {
                viewer.src = secondaryUrl;
                return;
            }
            if (viewer.src !== FALLBACK_3D_MODEL) {
                viewer.src = FALLBACK_3D_MODEL;
                statusText.textContent = `⚠️ Could not load ${fileName} from Hugging Face`;
            }

    // ================= SPRITE KOORDINATER (MED STÖD FÖR MALE & FEMALE BILDER) =================
    function getSpriteFileName(key, genderOverride = null) {
        const g = (genderOverride || (currentSelection && currentSelection.gender) || 'Male').toLowerCase();
        if (["Human", "Dwarf", "Night Elf", "Gnome", "High Order Skyborne"].includes(key)) {
            return `alliance_races_${g}.png`;
        }
        if (["Orc", "Undead", "Tauren", "Troll", "Windshaper Skyborne"].includes(key)) {
            return `horde_races_${g}.png`;
        }
        if (["Warrior", "Hunter", "Mage", "Rogue"].includes(key)) return "classes1.png";
        if (["Priest", "Warlock", "Paladin"].includes(key)) return "classes2.png";
        if (["Druid", "Shaman"].includes(key)) return "classes3.png";
        if (key === "Alliance") return "alliance.png";
        if (key === "Horde") return "horde.png";
        return "";
    }

    const SPRITES = {
        "Horde":    { w: 112, h: 100, x: 0, y: 0, bgW: 112, bgH: 100 },

        "Priest":  { w: 60, h: 58, x: 2,   y: 0, bgW: 223, bgH: 80 },

        "Paladin": { w: 60, h: 58, x: 160, y: 0, bgW: 223, bgH: 80 },

        "Druid":   { w: 60, h: 58, x: 3,   y: 1, bgW: 147, bgH: 81 },
        "Shaman":  { w: 60, h: 58, x: 83,  y: 1, bgW: 147, bgH: 81 }
    };

    function createSpriteHTML(key, targetSize = 54, genderOverride = null) {
        const s = SPRITES[key];
        if (!s) return '';
        const fileName = getSpriteFileName(key, genderOverride);
        const scale = targetSize / s.w;
        const finalW = Math.round(s.w * scale);
        const finalH = Math.round(s.h * scale);
        const bgW = Math.round(s.bgW * scale);
        const bgH = Math.round(s.bgH * scale);
        const posX = -Math.round(s.x * scale);
        const posY = -Math.round(s.y * scale);

        return `<div class="icon-box" style="
            width: ${finalW}px;
            height: ${finalH}px;
            background-image: url('${fileName}');
            background-position: ${posX}px ${posY}px;
            background-size: ${bgW}px ${bgH}px;
        " title="${key}"></div>`;
    }

    function initScreen() {
        document.getElementById('logo-alliance').innerHTML = createSpriteHTML("Alliance", 52);

        renderBanners();
        renderClassBar();

        updateRightPanels();

    function renderBanners() {
        const aList = document.getElementById('alliance-races-list');
        const hList = document.getElementById('horde-races-list');
        aList.innerHTML = '';
        hList.innerHTML = '';

        racesByFaction["Alliance"].forEach(race => {
            const div = document.createElement('div');
            div.className = `race-slot ${currentSelection.race === race ? 'selected' : ''}`;
            div.onclick = () => selectRace("Alliance", race);
            div.innerHTML = createSpriteHTML(race, 56);
            aList.appendChild(div);
        });

        racesByFaction["Horde"].forEach(race => {
            const div = document.createElement('div');
            div.className = `race-slot ${currentSelection.race === race ? 'selected' : ''}`;
            div.onclick = () => selectRace("Horde", race);
            div.innerHTML = createSpriteHTML(race, 56);
            hList.appendChild(div);
        });
    }

    function renderClassBar() {
        const bar = document.getElementById('class-bar');
        bar.innerHTML = '';
        const allowedClasses = classesByRace[currentSelection.race] || [];

        ALL_CLASSES.forEach(cls => {
            const isAllowed = allowedClasses.includes(cls);
            const isSelected = currentSelection.charClass === cls;
            const slot = document.createElement('div');
            slot.className = `class-slot ${!isAllowed ? 'disabled' : ''} ${isSelected ? 'selected' : ''}`;
            if (isAllowed) {
                slot.onclick = () => selectClass(cls);
            }
            slot.innerHTML = `
                <div class="class-icon-wrap">${createSpriteHTML(cls, 46)}</div>
                <span>${cls}</span>
            `;
            bar.appendChild(slot);
        });
    }

    function renderSpecBar(highlightWinner = false) {
        const bar = document.getElementById('spec-bar');
        const specs = specsByClass[currentSelection.charClass] || [];

        if (!specs.some(s => s.name === currentSelection.spec)) {
            currentSelection.spec = specs[0].name;
            currentSelection.role = specs[0].role;
        }

        bar.innerHTML = `<span class="role-bar-label">Spec:</span>`;

        specs.forEach(s => {
            const isSelected = currentSelection.spec === s.name;
            const btn = document.createElement('div');
            btn.className = `role-slot ${isSelected ? 'selected' : ''} ${(isSelected && highlightWinner) ? 'winner-glow' : ''}`;
            btn.onclick = () => selectSpec(s.name, s.role);
            btn.innerHTML = `
                ${createSpecIconHTML(s.name, currentSelection.charClass, 28)}
                <span>${s.name}</span>
            `;
            bar.appendChild(btn);
        });
    }

    function selectSpec(specName, autoRole) {
        currentSelection.spec = specName;
        currentSelection.role = autoRole; // Väljer automatiskt rätt Role när man väljer Spec
        renderSpecBar();
        renderRoleBar(true);
    }

    function renderRoleBar(highlightWinner = false) {
        const bar = document.getElementById('role-bar');
        const specs = specsByClass[currentSelection.charClass] || [];
        const activeSpec = specs.find(s => s.name === currentSelection.spec);

        // Lås tillåtna roller till exakt den roll som den valda specen har:
        let allowedRoles = activeSpec ? [activeSpec.role] : ["DPS"];

        // (Valfritt undantag: Feral Druid kan vara både Tank och DPS i Classic)
        if (currentSelection.charClass === "Druid" && currentSelection.spec === "Feral") {
            allowedRoles = ["Tank", "DPS"];
        }

        // Om nuvarande roll inte är tillåten för specen, tvinga till rätt roll
        if (!allowedRoles.includes(currentSelection.role)) {
            currentSelection.role = allowedRoles[0];
        }

        bar.innerHTML = `<span class="role-bar-label">Role:</span>`;

        ALL_ROLES.forEach(role => {
            const isAllowed = allowedRoles.includes(role);
            const isSelected = currentSelection.role === role;
            const btn = document.createElement('div');
            btn.className = `role-slot ${!isAllowed ? 'disabled' : ''} ${isSelected ? 'selected' : ''} ${(isSelected && highlightWinner) ? 'winner-glow' : ''}`;
            if (isAllowed) {
                btn.onclick = () => selectRole(role);
            }
            btn.innerHTML = `
                ${createRoleIconHTML(role, 28)}
                <span>${role}</span>
            `;
            bar.appendChild(btn);
        });

        // "Help me!" slump-knapp
        const randBtn = document.createElement('div');
        randBtn.className = 'random-role-btn';
        randBtn.title = "Can't choose spec/role? Click to roll!";
        randBtn.onclick = () => rollRandomRole();
        randBtn.innerHTML = `
            <img id="random-role-img" src="Cant_choose_role_help_me.png" alt="?" class="role-icon-img" style="width:28px; height:28px;" onerror="this.style.opacity='0.3'">
            <span>Help me!</span>
        `;
        bar.appendChild(randBtn);
    }

        const randBtn = document.createElement('div');
        randBtn.className = 'random-role-btn';
        randBtn.title = "Can't choose spec/role? Click to roll!";
        randBtn.onclick = () => rollRandomRole();
        randBtn.innerHTML = `
            <img id="random-role-img" src="Cant_choose_role_help_me.png" alt="?" class="role-icon-img" style="width:28px; height:28px;" onerror="this.style.opacity='0.3'">
            <span>Help me!</span>
        `;
        bar.appendChild(randBtn);
    }

    function rollRandomRole() {
        if (isRollingRole) return;
        isRollingRole = true;

        const img = document.getElementById('random-role-img');
        if (img) {
            img.classList.remove('spin-anim');
            void img.offsetWidth;
            img.classList.add('spin-anim');
        }

        const specs = specsByClass[currentSelection.charClass] || [];

        setTimeout(() => {
            const randomSpec = specs[Math.floor(Math.random() * specs.length)];
            currentSelection.spec = randomSpec.name;
            currentSelection.role = randomSpec.role;
            isRollingRole = false;
            renderSpecBar(true);
            renderRoleBar(true);
        }, 800);
    }

    function selectRace(faction, race) {
        currentSelection.faction = faction;
        currentSelection.race = race;
        const allowed = classesByRace[race];
        if (!allowed.includes(currentSelection.charClass)) {
            currentSelection.charClass = allowed[0];
            const specs = specsByClass[currentSelection.charClass] || [];
            currentSelection.spec = specs[0].name;
            currentSelection.role = specs[0].role;
        }
        renderBanners();
        renderClassBar();
        renderSpecBar();
        renderRoleBar();
        updateRightPanels();
        update3DModel();
    }

    function selectClass(cls) {
        currentSelection.charClass = cls;
        const specs = specsByClass[cls] || [];
        currentSelection.spec = specs[0].name;
        currentSelection.role = specs[0].role;
        renderClassBar();
        renderSpecBar();
        renderRoleBar();
        updateRightPanels();
    }

    function selectRole(role) {
        currentSelection.role = role;
        renderRoleBar();
    }

    function selectGender(gender) {
        currentSelection.gender = gender;
        document.getElementById('gender-male').classList.toggle('selected', gender === 'Male');
        document.getElementById('gender-female').classList.toggle('selected', gender === 'Female');
        renderBanners();
        update3DModel();
    }

    function updateRightPanels() {
        document.getElementById('info-faction-title').textContent = currentSelection.faction;
        document.getElementById('info-faction-desc').textContent = FACTION_LORE[currentSelection.faction];

        document.getElementById('info-race-title').textContent = currentSelection.race;
        const traits = RACE_TRAITS[currentSelection.race] || [];
        document.getElementById('info-race-traits').innerHTML = traits.map(t =>
            `<div class="trait-item"><strong>${t[0]}:</strong> ${t[1]}</div>`
        ).join('');

        document.getElementById('info-class-title').textContent = currentSelection.charClass;
        document.getElementById('info-class-desc').textContent = CLASS_LORE[currentSelection.charClass];
    }

    // ================= MODAL, FIREBASE & PROCENT-STATISTIK =================
    function switchModalTab(tab) {
        document.getElementById('tab-btn-list').classList.toggle('active', tab === 'list');
        document.getElementById('tab-btn-stats').classList.toggle('active', tab === 'stats');
        document.getElementById('tab-content-list').style.display = (tab === 'list') ? 'block' : 'none';
        document.getElementById('tab-content-stats').style.display = (tab === 'stats') ? 'block' : 'none';
    }

    function openModal(mode) {
        document.getElementById('save-section').style.display = (mode === 'save') ? 'block' : 'none';
        if (mode === 'save') {
            document.getElementById('modal-summary').textContent =
                `${currentSelection.faction} — ${currentSelection.gender} ${currentSelection.race} | ${currentSelection.spec} ${currentSelection.charClass} (${currentSelection.role})`;
            document.getElementById('modal-preview-icons').innerHTML = `
                ${createSpriteHTML(currentSelection.faction, 48)}
                ${createSpriteHTML(currentSelection.race, 48, currentSelection.gender)}
                ${createSpriteHTML(currentSelection.charClass, 48)}
                ${createSpecIconHTML(currentSelection.spec, currentSelection.charClass, 44)}
                ${createRoleIconHTML(currentSelection.role, 44)}
            `;
        }
        loadEntriesFromInternet();
        document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.remove('active');
    }

    function getCleanDbUrl() {
        return DATABASE_URL.replace(/\/$/, "") + "/characters.json";
    }

    async function submitPoll() {
        const nameInput = document.getElementById('player-name').value.trim();
        if (!nameInput) {
            alert("Please enter your name!");
            return;
        }
        currentSelection.name = nameInput;
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = "Saving...";

        try {
            await fetch(getCleanDbUrl(), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentSelection)
            });
            document.getElementById('player-name').value = '';
            document.getElementById('save-section').style.display = 'none';
            await loadEntriesFromInternet();
        } catch (e) {
            alert("Could not save to Firebase.");
        }
        btn.disabled = false;
        btn.textContent = "Save Character";
    }

    async function loadEntriesFromInternet() {
        const listContainer = document.getElementById('entries-container');
        const statsContainer = document.getElementById('stats-container');
        try {
            const response = await fetch(getCleanDbUrl());
            const data = await response.json();
            if (!data) {
                listContainer.innerHTML = '<p style="color:#777;">No characters saved yet.</p>';
                statsContainer.innerHTML = '<p style="color:#777;">No statistics available yet.</p>';
                return;
            }
            const entries = Object.values(data).reverse();

            listContainer.innerHTML = entries.map(item => {
                const roleName = item.role || "DPS";
                const specName = item.spec || "";
                return `
                    <div class="saved-item">
                        <div>
                            <strong style="color:#ffd100;">${escapeHtml(item.name)}</strong> — ${item.faction} | ${item.gender ? item.gender + ' ' : ''}${item.race} | ${specName ? specName + ' ' : ''}${item.charClass} <span style="color:#c9b182;">(${roleName})</span>
                        </div>
                        <div class="saved-icons">
                            ${createSpriteHTML(item.faction, 28)}
                            ${createSpriteHTML(item.race, 28, item.gender || 'Male')}
                            ${createSpriteHTML(item.charClass, 28)}
                            ${specName ? createSpecIconHTML(specName, item.charClass, 26) : ''}
                            ${createRoleIconHTML(roleName, 26)}
                        </div>
                    </div>
                `;
            }).join('');

            renderStatistics(entries);
        } catch (err) {
            listContainer.innerHTML = '<p style="color:#ff5555;">Could not load list.</p>';
            statsContainer.innerHTML = '<p style="color:#ff5555;">Could not load statistics.</p>';
        }
    }

    function renderStatistics(entries) {
        const total = entries.length;
        const statsContainer = document.getElementById('stats-container');
        if (total === 0) return;

        function buildCategoryHtml(title, keys, fieldName, defaultVal = null) {
            const counts = {};
            keys.forEach(k => counts[k] = 0);
            entries.forEach(e => {
                const val = e[fieldName] || defaultVal;
                if (val && counts[val] !== undefined) counts[val]++;
            });

            const sortedKeys = [...keys].sort((a, b) => counts[b] - counts[a]);

            const rowsHtml = sortedKeys.map(k => {
                const count = counts[k];
                const pct = Math.round((count / total) * 100);
                return `
                    <div class="stat-row">
                        <div class="stat-row-header">
                            <span>${k}</span>
                            <strong>${pct}% (${count})</strong>
                        </div>
                        <div class="stat-bar-bg">
                            <div class="stat-bar-fill" style="width: ${pct}%;"></div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="stat-card">
                    <h4>${title} (Total: ${total})</h4>
                    ${rowsHtml}
                </div>
            `;
        }

        const allRaces = [...racesByFaction["Alliance"], ...racesByFaction["Horde"]];

        statsContainer.innerHTML = `
            <div class="stats-grid">
                ${buildCategoryHtml("Factions", ["Alliance", "Horde"], "faction")}
                ${buildCategoryHtml("Roles", ["Tank", "Healer", "DPS"], "role", "DPS")}
                ${buildCategoryHtml("Classes", ALL_CLASSES, "charClass")}
                ${buildCategoryHtml("Races", allRaces, "race")}
            </div>
        `;
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // ================= YOUTUBE MUSIK/VIDEO =================
    const YOUTUBE_VIDEO_ID = "7I3t-zubmBM";
    let ytPlayer;
    let isPlayerReady = false;
    let soundUnlocked = false;
    const musicBtn = document.getElementById('music-btn');

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('yt-player', {
            videoId: YOUTUBE_VIDEO_ID,
            playerVars: {
                autoplay: 1, controls: 0, showinfo: 0, modestbranding: 1,
                loop: 1, playlist: YOUTUBE_VIDEO_ID, fs: 0, mute: 1, playsinline: 1
            },
            events: {
                onReady: function(e) {
                    isPlayerReady = true;
                    e.target.setVolume(35);
                    e.target.playVideo();
                },
                onStateChange: function(e) {
                    if (e.data === YT.PlayerState.ENDED) ytPlayer.playVideo();
                }
            }
        });
    }

    function toggleSound(event) {
        event.stopPropagation();
        if (!isPlayerReady) return;
        soundUnlocked = true;
        if (ytPlayer.isMuted()) {
            ytPlayer.unMute();
            ytPlayer.setVolume(35);
            ytPlayer.playVideo();
            musicBtn.innerHTML = "🔊 Mute Sound";
        } else {
            ytPlayer.mute();
            musicBtn.innerHTML = "🔇 Enable Sound";
        }
    }

    document.body.addEventListener('click', function unlockOnFirstClick() {
        if (!soundUnlocked && isPlayerReady) {
            soundUnlocked = true;
            ytPlayer.unMute();
            ytPlayer.setVolume(35);
            ytPlayer.playVideo();
            musicBtn.innerHTML = "🔊 Mute Sound";
            document.body.removeEventListener('click', unlockOnFirstClick);
        }
    });

    initScreen();
</script>
