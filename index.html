<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Character Creation Poll</title>
    <!-- Googles 3D-motor för .glb/.gltf-modeller -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* YOUTUBE BAKGRUND */
        .video-background {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2; overflow: hidden; pointer-events: none;
        }
        .video-background iframe {
            position: absolute; top: 50%; left: 50%;
            width: 100vw; height: 56.25vw;
            min-height: 100vh; min-width: 177.77vh;
            transform: translate(-50%, -50%); border: 0;
        }
        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 20%, rgba(0,0,0,0.65) 100%);
            z-index: -1; pointer-events: none;
        }

        /* 3D-SCEN I MITTEN */
        #center-stage {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        model-viewer {
            width: 100%;
            height: 84vh;
            margin-top: -2vh;
            --poster-color: transparent;
            outline: none;
            cursor: grab;
        }
        model-viewer:active {
            cursor: grabbing;
        }
        .rotate-hint {
            position: absolute;
            bottom: 128px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid #6b5a3e;
            color: #ffd100;
            font-size: 12px;
            padding: 5px 16px;
            border-radius: 15px;
            pointer-events: none;
            z-index: 5;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.8);
        }

        /* VÄNSTER SIDA: ALLIANCE & HORDE BANNERS */
        .left-banners {
            position: absolute;
            top: 15px; left: 20px;
            display: flex; gap: 14px;
            z-index: 10;
        }
        .banner {
            width: 82px;
            padding: 12px 6px 28px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: 2px solid #7c6c4f;
            border-top: none;
            clip-path: polygon(0 0, 100% 0, 100% 93%, 50% 100%, 0 93%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }
        .banner.alliance {
            background: linear-gradient(180deg, #163a70 0%, #0d2346 85%, #07152b 100%);
        }
        .banner.horde {
            background: linear-gradient(180deg, #6b1515 0%, #450b0b 85%, #240505 100%);
        }
        .banner-title {
            font-size: 11px;
            font-weight: bold;
            color: #ffd100;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-shadow: 0 2px 3px #000;
        }
        .race-slot {
            padding: 2px;
            border: 2px solid #5a4b32;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            background: #111;
        }
        .race-slot:hover {
            border-color: #bca676;
            transform: scale(1.05);
        }
        .race-slot.selected {
            border-color: #fff3a1;
            box-shadow: 0 0 14px #ffd100, 0 0 6px #ffffff;
            transform: scale(1.07);
        }

        /* HÖGST UPP I MITTEN: KÖN (MALE / FEMALE) */
        .gender-bar {
            position: absolute;
            top: 16px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 8px;
            background: rgba(15, 13, 10, 0.88);
            padding: 6px;
            border: 2px solid #6e5e43;
            border-radius: 8px;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .gender-btn {
            width: 44px; height: 44px;
            background: #25221e;
            border: 2px solid #554833;
            border-radius: 5px;
            color: #888;
            font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: 0.15s;
        }
        .gender-btn.selected {
            border-color: #fff3a1;
            color: #ffd100;
            background: #3a3222;
            box-shadow: 0 0 10px #ffd100;
        }

        /* HÖGER SIDA: 3 INFO-PANELER (FACTION, RACE, CLASS) */
        .right-panels {
            position: absolute;
            top: 15px; right: 20px;
            width: 310px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
            max-height: calc(100vh - 110px);
        }
        .wow-box {
            background: rgba(18, 15, 12, 0.88);
            border: 2px solid #6e5e43;
            border-radius: 6px;
            padding: 12px 14px 12px 24px;
            position: relative;
            box-shadow: 0 6px 20px rgba(0,0,0,0.85);
            text-align: left;
            flex: 1;
            overflow-y: auto;
        }
        .wow-box::-webkit-scrollbar { width: 5px; }
        .wow-box::-webkit-scrollbar-thumb { background: #6e5e43; border-radius: 3px; }
        .wow-box h3 {
            margin: 0 0 6px 0;
            color: #ffffff;
            font-size: 16px;
            text-shadow: 0 1px 3px #000;
        }
        .wow-box .sub-label {
            color: #ffd100;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
            display: block;
        }
        .wow-box p {
            margin: 0;
            color: #e5c687;
            font-size: 12.5px;
            line-height: 1.45;
        }
        .trait-item {
            margin-bottom: 8px;
            font-size: 12px;
            color: #d8c090;
            line-height: 1.35;
        }
        .trait-item strong {
            color: #ffffff;
        }

        /* LÄNGST NER I MITTEN: CLASS BAR */
        .bottom-class-bar {
            position: absolute;
            bottom: 14px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 10px;
            background: rgba(16, 14, 11, 0.92);
            padding: 10px 16px;
            border: 2px solid #6e5e43;
            border-radius: 8px;
            z-index: 10;
            box-shadow: 0 8px 25px rgba(0,0,0,0.95);
        }
        .class-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 58px;
            transition: all 0.15s;
        }
        .class-icon-wrap {
            padding: 2px;
            border: 2px solid #5a4b32;
            border-radius: 6px;
            background: #111;
            transition: 0.15s;
        }
        .class-slot:hover:not(.disabled) .class-icon-wrap {
            border-color: #d6be8a;
            transform: translateY(-2px);
        }
        .class-slot.selected .class-icon-wrap {
            border-color: #fff3a1;
            box-shadow: 0 0 14px #ffd100, 0 0 6px #fff;
            transform: scale(1.06);
        }
        .class-slot span {
            margin-top: 5px;
            font-size: 11px;
            color: #ffd100;
            font-weight: bold;
            text-shadow: 0 1px 2px #000;
        }
        .class-slot.disabled {
            filter: grayscale(100%) brightness(38%);
            cursor: not-allowed;
        }
        .class-slot.disabled span {
            color: #777;
        }

        /* RÖDA WOW-KNAPPAR I NEDRE HÖRNEN */
        .wow-red-btn {
            position: absolute;
            bottom: 22px;
            background: linear-gradient(180deg, #9b1c1c 0%, #630d0d 100%);
            color: #ffd100;
            border: 2px solid #8c7853;
            border-radius: 5px;
            padding: 10px 28px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
            text-shadow: 0 2px 3px #000;
            transition: 0.15s;
        }
        .wow-red-btn:hover {
            background: linear-gradient(180deg, #bd2424 0%, #7d1212 100%);
            color: #ffffff;
            border-color: #ffd100;
        }
        .btn-left { left: 24px; }
        .btn-right { right: 24px; }

        /* LJUDKNAPP */
        .sound-btn {
            position: absolute;
            top: 18px; left: 215px;
            background: rgba(18, 15, 12, 0.85);
            color: #ffd100;
            border: 1px solid #6e5e43;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            z-index: 10;
        }
        .sound-btn:hover { border-color: #ffd100; }

        .icon-box {
            border-radius: 4px;
            background-repeat: no-repeat;
            display: block;
        }

        /* MODAL FÖR NAMN & SPARA + LISTA PÅ ALLAS KARAKTÄRER */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #181512;
            border: 2px solid #8c7853;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            padding: 25px;
            box-shadow: 0 10px 40px #000;
            text-align: center;
            max-height: 88vh;
            overflow-y: auto;
        }
        .modal-box h2 { color: #ffd100; margin-top: 0; }
        .name-input {
            padding: 10px 14px;
            font-size: 16px;
            background: #0d0b09;
            border: 2px solid #6e5e43;
            color: #fff;
            border-radius: 5px;
            width: 70%;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }
        .name-input:focus { border-color: #ffd100; }
        .saved-list {
            margin-top: 20px;
            text-align: left;
            background: #0e0c0a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #3a3225;
            max-height: 300px;
            overflow-y: auto;
        }
        .saved-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #221d17;
            font-size: 14px;
        }
        .saved-icons { display: flex; gap: 6px; }
    </style>
</head>
<body>

<!-- YOUTUBE BAKGRUNDSVIDEO -->
<div class="video-background">
    <div id="yt-player"></div>
</div>
<div class="video-overlay"></div>

<!-- LJUDKNAPP -->
<button id="music-btn" class="sound-btn" onclick="toggleSound(event)">🔇 Enable Sound</button>

<!-- HÖGST UPP: KÖNSVAL -->
<div class="gender-bar">
    <div id="gender-male" class="gender-btn selected" onclick="selectGender('Male')" title="Male">♂</div>
    <div id="gender-female" class="gender-btn" onclick="selectGender('Female')" title="Female">♀</div>
</div>

<!-- VÄNSTER: ALLIANCE & HORDE BANNERS -->
<div class="left-banners">
    <div class="banner alliance">
        <div id="logo-alliance"></div>
        <div class="banner-title">ALLIANCE</div>
        <div id="alliance-races-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
    <div class="banner horde">
        <div id="logo-horde"></div>
        <div class="banner-title">HORDE</div>
        <div id="horde-races-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
</div>

<!-- MITTEN: INTERAKTIV 3D-KARAKTÄR (MODEL-VIEWER) -->
<div id="center-stage">
    <model-viewer
        id="char-3d-viewer"
        src=""
        crossorigin="anonymous"
        camera-controls
        autoplay
        shadow-intensity="1.2"
        exposure="1"
        camera-orbit="0deg 82deg auto"
        min-camera-orbit="auto 60deg auto"
        max-camera-orbit="auto 95deg auto">
    </model-viewer>
    <div class="rotate-hint" id="model-status">🖱️ Drag with mouse to rotate 3D Character</div>
</div>

<!-- HÖGER: FACTION, RACE TRAITS & CLASS BESKRIVNING -->
<div class="right-panels">
    <div class="wow-box">
        <h3 id="info-faction-title">Horde</h3>
        <p id="info-faction-desc"></p>
    </div>
    <div class="wow-box">
        <h3 id="info-race-title">Troll</h3>
        <span class="sub-label">Racial Traits</span>
        <div id="info-race-traits"></div>
    </div>
    <div class="wow-box">
        <h3 id="info-class-title">Shaman</h3>
        <p id="info-class-desc"></p>
    </div>
</div>

<!-- LÄNGST NER: 9 KLASSER -->
<div class="bottom-class-bar" id="class-bar"></div>

<!-- NEDRE HÖRNKNAPPAR -->
<button class="wow-red-btn btn-left" onclick="openModal('list')">◄ View Saved List</button>
<button class="wow-red-btn btn-right" onclick="openModal('save')">Customize / Save ►</button>

<!-- POPUP-MODAL FÖR ATT SKRIVA NAMN & SE ALLAS VAL -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
        <div id="save-section">
            <h2>Name Your Character</h2>
            <p id="modal-summary" style="color:#e5c687; margin-bottom:14px; font-weight:bold;"></p>
            <div style="display:flex; justify-content:center; gap:14px; margin-bottom:18px;" id="modal-preview-icons"></div>
            <input type="text" id="player-name" class="name-input" placeholder="Enter character / player name..." />
            <br>
            <button id="submit-btn" class="wow-red-btn" style="position:static; padding:10px 30px;" onclick="submitPoll()">Save Character</button>
        </div>

        <div class="saved-list">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #3a3225; padding-bottom:8px; margin-bottom:8px;">
                <strong style="color:#ffd100;">Everyone's Characters (Live)</strong>
                <button onclick="loadEntriesFromInternet()" style="background:none; border:1px solid #ffd100; color:#ffd100; border-radius:4px; padding:3px 10px; cursor:pointer; font-size:12px;">↻ Refresh</button>
            </div>
            <div id="entries-container">Loading...</div>
        </div>

        <br>
        <button onclick="closeModal()" style="background:#333; color:#fff; border:1px solid #777; padding:8px 22px; border-radius:4px; cursor:pointer;">Close Window</button>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    // Din Firebase-länk
    const DATABASE_URL = "https://wow-poll-e8e48-default-rtdb.europe-west1.firebasedatabase.app/";

    // Din Hugging Face bas-URL (med /resolve/main för direktströmning av .glb-filerna)
    const HF_BASE_URL = "https://huggingface.co/datasets/fatto92/wow_models/resolve/main";

    // Reservmodell om en fil mot förmodan skulle saknas
    const FALLBACK_3D_MODEL = "https://modelviewer.dev/shared-assets/models/RobotExpressive.glb";

    // Mapp- och filnamnskonfiguration för alla 10 raser
    const RACE_CONFIG = {
        "Human":               { folder: "human",              filePrefix: "human" },
        "Dwarf":               { folder: "dwarf",              filePrefix: "dwarf" },
        "Night Elf":           { folder: "nightelf",           filePrefix: "nightelf" },
        "Gnome":               { folder: "gnome",              filePrefix: "gnome" },
        "High Order Skyborne": { folder: "undead",             altFolder: "highorderskyborne", filePrefix: "highorderskyborne" },
        "Orc":                 { folder: "orc",                filePrefix: "orc" },
        "Undead":              { folder: "undead",             filePrefix: "undead" },
        "Tauren":              { folder: "tauren",             filePrefix: "tauren" },
        "Troll":               { folder: "troll",              filePrefix: "troll" },
        "Windshaper Skyborne": { folder: "undead",             altFolder: "windshaperskyborne", filePrefix: "windshaperskyborne" }
    };

    function update3DModel() {
        const viewer = document.getElementById('char-3d-viewer');
        const statusText = document.getElementById('model-status');

        const cfg = RACE_CONFIG[currentSelection.race];
        const gender = currentSelection.gender.toLowerCase();
        const fileName = `${cfg.filePrefix}${gender}_hd.glb`;

        const primaryUrl = `${HF_BASE_URL}/character/${cfg.folder}/${gender}/${fileName}`;
        const secondaryUrl = cfg.altFolder
            ? `${HF_BASE_URL}/character/${cfg.altFolder}/${gender}/${fileName}`
            : null;

        statusText.textContent = `⏳ Loading 3D Model: ${currentSelection.race} (${currentSelection.gender})...`;
        viewer.src = primaryUrl;

        viewer.onload = () => {
            if (viewer.src !== FALLBACK_3D_MODEL) {
                statusText.textContent = `🖱️ ${currentSelection.race} (${currentSelection.gender}) — Drag with mouse to rotate`;
            }
        };

        viewer.onerror = () => {
            // Om filen inte låg i första mappen (t.ex. undead), testa reservmappen innan fallback
            if (secondaryUrl && viewer.src === primaryUrl) {
                viewer.src = secondaryUrl;
                return;
            }
            if (viewer.src !== FALLBACK_3D_MODEL) {
                viewer.src = FALLBACK_3D_MODEL;
                statusText.textContent = `⚠️ Could not load ${fileName} from Hugging Face`;
            }
        };
    }

    // ================= DATA: REGLER, LORE & RACIALS =================
    const ALL_CLASSES = ["Warrior", "Hunter", "Mage", "Rogue", "Priest", "Warlock", "Paladin", "Druid", "Shaman"];

    const racesByFaction = {
        "Alliance": ["Human", "Dwarf", "Night Elf", "Gnome", "High Order Skyborne"],
        "Horde": ["Orc", "Undead", "Tauren", "Troll", "Windshaper Skyborne"]
    };

    const classesByRace = {
        "Orc": ["Warrior", "Hunter", "Mage", "Rogue", "Warlock", "Shaman"],
        "Undead": ["Warrior", "Mage", "Rogue", "Priest", "Warlock", "Paladin"],
        "Tauren": ["Warrior", "Hunter", "Druid", "Shaman"],
        "Troll": ["Warrior", "Hunter", "Mage", "Rogue", "Priest", "Warlock", "Shaman"],
        "Windshaper Skyborne": ["Warrior", "Hunter", "Rogue", "Druid", "Shaman"],
        "Human": ["Warrior", "Hunter", "Mage", "Rogue", "Priest", "Warlock", "Paladin"],
        "Dwarf": ["Warrior", "Hunter", "Rogue", "Priest", "Paladin", "Shaman"],
        "Night Elf": ["Warrior", "Hunter", "Rogue", "Priest", "Druid"],
        "Gnome": ["Warrior", "Mage", "Rogue", "Priest", "Warlock"],
        "High Order Skyborne": ["Warrior", "Hunter", "Mage", "Rogue", "Druid"]
    };

    const FACTION_LORE = {
        "Alliance": "The noble races of the Alliance are bound together by proud traditions of nobility, honor, and faith in the Light. Together they stand united to preserve order in Azeroth.",
        "Horde": "The proud nations of the Horde are loosely joined in an alliance of convenience against a hostile world that would see them destroyed. Focused, ferocious, and sometimes monstrous, the Horde values strength and honor."
    };

    const RACE_TRAITS = {
        "Human": [
            ["Will to Survive", "Removes all movement impairing effects and effects which cause loss of control."],
            ["The Human Spirit", "Spirit increased by 5%."],
            ["Diplomacy", "Reputation gains increased by 10%."]
        ],
        "Dwarf": [
            ["Stoneform", "Removes all poison, disease and bleed effects and increases Armor by 10% for 8 sec."],
            ["Gun & Mace Specialization", "Increases expertise with Guns and Maces."],
            ["Frost Resistance", "Reduces Frost damage taken."]
        ],
        "Night Elf": [
            ["Shadowmeld", "Activate to slip into the shadows, reducing the chance for enemies to detect your presence."],
            ["Quickness", "Reduces the chance that melee and ranged attackers will hit you by 2%."],
            ["Nature Resistance", "Reduces Nature damage taken."]
        ],
        "Gnome": [
            ["Escape Artist", "Escape the effects of any immobilization or movement speed reduction effect."],
            ["Expansive Mind", "Intellect increased by 5%."],
            ["Arcane Resistance", "Reduces Arcane damage taken."]
        ],
        "High Order Skyborne": [
            ["Ascendant Flight", "Harness the astral winds to leap forward or glide swiftly across the battlefield."],
            ["Celestial Attunement", "Increases haste and arcane/nature affinity."],
            ["Skyguard Heritage", "Resilience against elemental effects."]
        ],
        "Orc": [
            ["Blood Fury", "Increases attack power and spell power for 15 sec."],
            ["Hardiness", "Duration of Stun effects reduced by an additional 15%."],
            ["Command", "Damage dealt by pets increased by 5%."]
        ],
        "Undead": [
            ["Will of the Forsaken", "Removes any Charm, Fear and Sleep effect."],
            ["Cannibalize", "When activated, regenerates 7% of total health and mana every 2 sec for 10 sec."],
            ["Shadow Resistance", "Reduces Shadow damage taken."]
        ],
        "Tauren": [
            ["War Stomp", "Stuns up to 5 enemies within 8 yards for 2 sec."],
            ["Endurance", "Base Health increased by 5%."],
            ["Nature Resistance", "Reduces Nature damage taken."]
        ],
        "Troll": [
            ["Berserking", "Increases casting and attack speed by 10% for 10 sec."],
            ["Rapid Regeneration", "Regenerate 50% of maximum Health over time."],
            ["Beast Slaying (Passive)", "Damage dealt versus Beasts increased by 5%."]
        ],
        "Windshaper Skyborne": [
            ["Gale Surge", "Call upon primal winds to empower your movement and strikes."],
            ["Stormborn", "Increases critical strike and elemental mastery."],
            ["Windswept Grace", "Reduces falling damage and enhances agility."]
        ]
    };

    const CLASS_LORE = {
        "Warrior": "For as long as war has raged, heroes from every race have aimed to master the art of battle. Warriors combine strength, leadership, and a vast knowledge of arms and armor to wreak havoc in glorious combat.",
        "Hunter": "From an early age the call of the wild draws some adventurers from the comfort of their homes into the unforgiving primal world. Those who endure become hunters, masters of their environment and loyal animal companions.",
        "Mage": "Students gifted with a keen intellect and unwavering discipline may walk the path of the mage. The arcane magic available to magi is both great and dangerous, and thus is revealed only to the most devoted practitioners.",
        "Rogue": "For rogues, the only code is the contract, and their honor is purchased in gold. Free from the constraints of a conscience, these mercenaries rely on brutal and efficient tactics, striking from the shadows.",
        "Priest": "Priests are devoted to the spiritual, and express their unwavering faith by serving the people. For millennia they have left behind the confines of their temples to support their allies in war-torn lands.",
        "Warlock": "In the face of demonic power, most heroes see death. Warlocks see only opportunity. Dominance is their aim, and they have found a path to it in the dark arts, summoning demonic minions to fight beside them.",
        "Paladin": "This is the call of the paladin: to protect the weak, to bring justice to the unjust, and to vanquish evil from the darkest corners of the world. These holy warriors are equipped with plate armor and the blessing of the Light.",
        "Druid": "Druids harness the vast powers of nature to preserve balance and protect life. With experience, druids can unleash nature's raw energy against their enemies, shapeshifting into powerful beasts.",
        "Shaman": "Shaman commune directly with the elements. Their combination of wisdom and resilience makes them ideal as community advisors and leaders. In battle the shaman use totems and spells to manipulate the elements."
    };

    // ================= SPRITE KOORDINATER FRÅN DINA 7 BILDER =================
    const SPRITES = {
        "Horde":    { file: "horde.png",    w: 112, h: 100, x: 0, y: 0, bgW: 112, bgH: 100 },
        "Alliance": { file: "alliance.png", w: 112, h: 102, x: 0, y: 0, bgW: 112, bgH: 102 },

        "Human":               { file: "alliance_races.png", w: 77, h: 80, x: 0, y: 0,   bgW: 77, bgH: 444 },
        "Dwarf":               { file: "alliance_races.png", w: 77, h: 80, x: 0, y: 90,  bgW: 77, bgH: 444 },
        "Night Elf":           { file: "alliance_races.png", w: 77, h: 80, x: 0, y: 180, bgW: 77, bgH: 444 },
        "Gnome":               { file: "alliance_races.png", w: 77, h: 80, x: 0, y: 270, bgW: 77, bgH: 444 },
        "High Order Skyborne": { file: "alliance_races.png", w: 77, h: 84, x: 0, y: 360, bgW: 77, bgH: 444 },

        "Orc":                 { file: "horde_races.png", w: 74, h: 78, x: 0, y: 0,   bgW: 74, bgH: 438 },
        "Undead":              { file: "horde_races.png", w: 74, h: 78, x: 0, y: 90,  bgW: 74, bgH: 438 },
        "Tauren":              { file: "horde_races.png", w: 74, h: 78, x: 0, y: 180, bgW: 74, bgH: 438 },
        "Troll":               { file: "horde_races.png", w: 74, h: 78, x: 0, y: 270, bgW: 74, bgH: 438 },
        "Windshaper Skyborne": { file: "horde_races.png", w: 74, h: 78, x: 0, y: 360, bgW: 74, bgH: 438 },

        "Warrior": { file: "classes1.png", w: 60, h: 58, x: 0,   y: 0, bgW: 299, bgH: 81 },
        "Hunter":  { file: "classes1.png", w: 60, h: 58, x: 79,  y: 0, bgW: 299, bgH: 81 },
        "Mage":    { file: "classes1.png", w: 64, h: 60, x: 155, y: 0, bgW: 299, bgH: 81 },
        "Rogue":   { file: "classes1.png", w: 60, h: 58, x: 237, y: 0, bgW: 299, bgH: 81 },

        "Priest":  { file: "classes2.png", w: 60, h: 58, x: 2,   y: 0, bgW: 223, bgH: 80 },
        "Warlock": { file: "classes2.png", w: 60, h: 58, x: 81,  y: 0, bgW: 223, bgH: 80 },
        "Paladin": { file: "classes2.png", w: 60, h: 58, x: 160, y: 0, bgW: 223, bgH: 80 },

        "Druid":   { file: "classes3.png", w: 60, h: 58, x: 3,   y: 1, bgW: 147, bgH: 81 },
        "Shaman":  { file: "classes3.png", w: 60, h: 58, x: 83,  y: 1, bgW: 147, bgH: 81 }
    };

    function createSpriteHTML(key, targetSize = 54) {
        const s = SPRITES[key];
        if (!s) return '';
        const scale = targetSize / s.w;
        const finalW = Math.round(s.w * scale);
        const finalH = Math.round(s.h * scale);
        const bgW = Math.round(s.bgW * scale);
        const bgH = Math.round(s.bgH * scale);
        const posX = -Math.round(s.x * scale);
        const posY = -Math.round(s.y * scale);

        return `<div class="icon-box" style="
            width: ${finalW}px;
            height: ${finalH}px;
            background-image: url('${s.file}');
            background-position: ${posX}px ${posY}px;
            background-size: ${bgW}px ${bgH}px;
        " title="${key}"></div>`;
    }

    // ================= STATE & UI UPPDATERING =================
    let currentSelection = {
        faction: "Horde",
        race: "Troll",
        charClass: "Shaman",
        gender: "Male",
        name: ""
    };

    function initScreen() {
        document.getElementById('logo-alliance').innerHTML = createSpriteHTML("Alliance", 52);
        document.getElementById('logo-horde').innerHTML = createSpriteHTML("Horde", 52);
        renderBanners();
        renderClassBar();
        updateRightPanels();
        update3DModel();
    }

    function renderBanners() {
        const aList = document.getElementById('alliance-races-list');
        const hList = document.getElementById('horde-races-list');
        aList.innerHTML = '';
        hList.innerHTML = '';

        racesByFaction["Alliance"].forEach(race => {
            const div = document.createElement('div');
            div.className = `race-slot ${currentSelection.race === race ? 'selected' : ''}`;
            div.onclick = () => selectRace("Alliance", race);
            div.innerHTML = createSpriteHTML(race, 56);
            aList.appendChild(div);
        });

        racesByFaction["Horde"].forEach(race => {
            const div = document.createElement('div');
            div.className = `race-slot ${currentSelection.race === race ? 'selected' : ''}`;
            div.onclick = () => selectRace("Horde", race);
            div.innerHTML = createSpriteHTML(race, 56);
            hList.appendChild(div);
        });
    }

    function renderClassBar() {
        const bar = document.getElementById('class-bar');
        bar.innerHTML = '';
        const allowedClasses = classesByRace[currentSelection.race] || [];

        ALL_CLASSES.forEach(cls => {
            const isAllowed = allowedClasses.includes(cls);
            const isSelected = currentSelection.charClass === cls;
            const slot = document.createElement('div');
            slot.className = `class-slot ${!isAllowed ? 'disabled' : ''} ${isSelected ? 'selected' : ''}`;
            if (isAllowed) {
                slot.onclick = () => selectClass(cls);
            }
            slot.innerHTML = `
                <div class="class-icon-wrap">${createSpriteHTML(cls, 46)}</div>
                <span>${cls}</span>
            `;
            bar.appendChild(slot);
        });
    }

    function selectRace(faction, race) {
        currentSelection.faction = faction;
        currentSelection.race = race;
        const allowed = classesByRace[race];
        if (!allowed.includes(currentSelection.charClass)) {
            currentSelection.charClass = allowed[0];
        }
        renderBanners();
        renderClassBar();
        updateRightPanels();
        update3DModel();
    }

    function selectClass(cls) {
        currentSelection.charClass = cls;
        renderClassBar();
        updateRightPanels();
    }

    function selectGender(gender) {
        currentSelection.gender = gender;
        document.getElementById('gender-male').classList.toggle('selected', gender === 'Male');
        document.getElementById('gender-female').classList.toggle('selected', gender === 'Female');
        update3DModel();
    }

    function updateRightPanels() {
        document.getElementById('info-faction-title').textContent = currentSelection.faction;
        document.getElementById('info-faction-desc').textContent = FACTION_LORE[currentSelection.faction];

        document.getElementById('info-race-title').textContent = currentSelection.race;
        const traits = RACE_TRAITS[currentSelection.race] || [];
        document.getElementById('info-race-traits').innerHTML = traits.map(t =>
            `<div class="trait-item"><strong>${t[0]}:</strong> ${t[1]}</div>`
        ).join('');

        document.getElementById('info-class-title').textContent = currentSelection.charClass;
        document.getElementById('info-class-desc').textContent = CLASS_LORE[currentSelection.charClass];
    }

    // ================= MODAL & FIREBASE =================
    function openModal(mode) {
        document.getElementById('save-section').style.display = (mode === 'save') ? 'block' : 'none';
        if (mode === 'save') {
            document.getElementById('modal-summary').textContent =
                `${currentSelection.faction} — ${currentSelection.gender} ${currentSelection.race} ${currentSelection.charClass}`;
            document.getElementById('modal-preview-icons').innerHTML = `
                ${createSpriteHTML(currentSelection.faction, 55)}
                ${createSpriteHTML(currentSelection.race, 55)}
                ${createSpriteHTML(currentSelection.charClass, 55)}
            `;
        }
        loadEntriesFromInternet();
        document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.remove('active');
    }

    function getCleanDbUrl() {
        return DATABASE_URL.replace(/\/$/, "") + "/characters.json";
    }

    async function submitPoll() {
        const nameInput = document.getElementById('player-name').value.trim();
        if (!nameInput) {
            alert("Please enter your name!");
            return;
        }
        currentSelection.name = nameInput;
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = "Saving...";

        try {
            await fetch(getCleanDbUrl(), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentSelection)
            });
            document.getElementById('player-name').value = '';
            document.getElementById('save-section').style.display = 'none';
            await loadEntriesFromInternet();
        } catch (e) {
            alert("Could not save to Firebase.");
        }
        btn.disabled = false;
        btn.textContent = "Save Character";
    }

    async function loadEntriesFromInternet() {
        const container = document.getElementById('entries-container');
        try {
            const response = await fetch(getCleanDbUrl());
            const data = await response.json();
            if (!data) {
                container.innerHTML = '<p style="color:#777;">No characters saved yet.</p>';
                return;
            }
            const entries = Object.values(data).reverse();
            container.innerHTML = entries.map(item => `
                <div class="saved-item">
                    <div>
                        <strong style="color:#ffd100;">${escapeHtml(item.name)}</strong> — ${item.faction} | ${item.gender ? item.gender + ' ' : ''}${item.race} ${item.charClass}
                    </div>
                    <div class="saved-icons">
                        ${createSpriteHTML(item.faction, 30)}
                        ${createSpriteHTML(item.race, 30)}
                        ${createSpriteHTML(item.charClass, 30)}
                    </div>
                </div>
            `).join('');
        } catch (err) {
            container.innerHTML = '<p style="color:#ff5555;">Could not load list.</p>';
        }
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // ================= YOUTUBE MUSIK/VIDEO =================
    const YOUTUBE_VIDEO_ID = "7I3t-zubmBM";
    let ytPlayer;
    let isPlayerReady = false;
    let soundUnlocked = false;
    const musicBtn = document.getElementById('music-btn');

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('yt-player', {
            videoId: YOUTUBE_VIDEO_ID,
            playerVars: {
                autoplay: 1, controls: 0, showinfo: 0, modestbranding: 1,
                loop: 1, playlist: YOUTUBE_VIDEO_ID, fs: 0, mute: 1, playsinline: 1
            },
            events: {
                onReady: function(e) {
                    isPlayerReady = true;
                    e.target.setVolume(35);
                    e.target.playVideo();
                },
                onStateChange: function(e) {
                    if (e.data === YT.PlayerState.ENDED) ytPlayer.playVideo();
                }
            }
        });
    }

    function toggleSound(event) {
        event.stopPropagation();
        if (!isPlayerReady) return;
        soundUnlocked = true;
        if (ytPlayer.isMuted()) {
            ytPlayer.unMute();
            ytPlayer.setVolume(35);
            ytPlayer.playVideo();
            musicBtn.innerHTML = "🔊 Mute Sound";
        } else {
            ytPlayer.mute();
            musicBtn.innerHTML = "🔇 Enable Sound";
        }
    }

    document.body.addEventListener('click', function unlockOnFirstClick() {
        if (!soundUnlocked && isPlayerReady) {
            soundUnlocked = true;
            ytPlayer.unMute();
            ytPlayer.setVolume(35);
            ytPlayer.playVideo();
            musicBtn.innerHTML = "🔊 Mute Sound";
            document.body.removeEventListener('click', unlockOnFirstClick);
        }
    });

    initScreen();
</script>
