<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Character Poll</title>
    <style>
        :root {
            --bg-color: #313338;
            --container-bg: #2b2d31;
            --text-color: #dbdee1;
            --text-muted: #949ba4;
            --alliance-blue: #0078ff;
            --horde-red: #c82222;
            --button-bg: #4e5058;
            --button-hover: #6d6f78;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .poll-container {
            background-color: var(--container-bg);
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 { margin-top: 0; color: #fff; margin-bottom: 25px; }
        .step { display: none; }
        .step.active { display: block; }
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .grid-options.single-col { grid-template-columns: 1fr; }
        .option-btn {
            background-color: var(--button-bg);
            color: #fff;
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-btn:hover { background-color: var(--button-hover); }
        .faction-alliance { background-color: #0b4da1; }
        .faction-alliance:hover { background-color: #0056b3; }
        .faction-horde { background-color: #8c1616; }
        .faction-horde:hover { background-color: #a71d1d; }
        .back-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; text-decoration: underline; margin-top: 20px; }
        .result-card { border: 2px solid #1e1f22; background-color: #1e1f22; border-radius: 8px; padding: 25px; margin-bottom: 20px; font-size: 20px; font-weight: bold; }
        .copy-btn { background-color: #248046; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
        .copy-btn:hover { background-color: #1a6535; }
        .success-msg { color: #23a55a; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="poll-container">
    <div id="step-faction" class="step active">
        <h2>Faction</h2>
        <div class="grid-options single-col">
            <button class="option-btn faction-alliance" onclick="selectFaction('Alliance')">ALLIANCE</button>
            <button class="option-btn faction-horde" onclick="selectFaction('Horde')">HORDE</button>
        </div>
    </div>

    <div id="step-race" class="step">
        <h2>Race</h2>
        <div id="race-options" class="grid-options"></div>
        <button class="back-btn" onclick="goBack('faction')">← Gå tillbaka</button>
    </div>

    <div id="step-class" class="step">
        <h2>Class</h2>
        <div id="class-options" class="grid-options"></div>
        <button class="back-btn" onclick="goBack('race')">← Gå tillbaka</button>
    </div>

    <div id="step-result" class="step">
        <h2>Ditt val är klart!</h2>
        <div class="result-card" id="result-card-box">
            <div id="result-text"></div>
        </div>
        <button class="copy-btn" onclick="copyToDiscord()">Kopiera till Discord</button>
        <div class="success-msg" id="success-text">Kopierat! Klistra in i Discord med Ctrl+V</div>
        <button class="back-btn" onclick="resetPoll()">Börja om →</button>
    </div>
</div>

<script>
    let selectedFaction = '', selectedRace = '', selectedClass = '';

    const classRestrictions = {
        'Orc': ['Warrior', 'Hunter', 'Mage', 'Rogue', 'Warlock', 'Shaman'],
        'Undead': ['Warrior', 'Mage', 'Rogue', 'Priest', 'Warlock', 'Paladin'],
        'Tauren': ['Warrior', 'Hunter', 'Druid', 'Shaman'],
        'Troll': ['Warrior', 'Hunter', 'Mage', 'Rogue', 'Priest', 'Warlock', 'Shaman'],
        'Windshaper Skyborne': ['Warrior', 'Hunter', 'Rogue', 'Druid', 'Shaman'],
        'Human': ['Warrior', 'Hunter', 'Mage', 'Rogue', 'Priest', 'Warlock', 'Paladin'],
        'Dwarf': ['Warrior', 'Hunter', 'Rogue', 'Priest', 'Paladin', 'Shaman'],
        'Night Elf': ['Warrior', 'Hunter', 'Rogue', 'Priest', 'Druid'],
        'Gnome': ['Warrior', 'Mage', 'Rogue', 'Priest', 'Warlock'],
        'High Order Skyborne': ['Warrior', 'Hunter', 'Mage', 'Rogue', 'Druid']
    };

    function selectFaction(faction) {
        selectedFaction = faction;
        const container = document.getElementById('race-options');
        container.innerHTML = '';
        let races = faction === 'Alliance' 
            ? ['Human', 'Dwarf', 'Night Elf', 'Gnome', 'High Order Skyborne']
            : ['Orc', 'Undead', 'Tauren', 'Troll', 'Windshaper Skyborne'];

        races.forEach(race => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = race;
            btn.onclick = () => selectRace(race);
            container.appendChild(btn);
        });
        switchStep('race');
    }

    function selectRace(race) {
        selectedRace = race;
        const container = document.getElementById('class-options');
        container.innerHTML = '';
        const classes = classRestrictions[race] || [];
        
        classes.forEach(cls => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = cls;
            btn.onclick = () => selectClass(cls);
            container.appendChild(btn);
        });
        switchStep('class');
    }

    function selectClass(cls) {
        selectedClass = cls;
        const emoji = selectedFaction === 'Alliance' ? '🔵' : '🔴';
        document.getElementById('result-text').innerText = `${emoji} ${selectedFaction}\n\nRas: ${selectedRace}\nKlass: ${selectedClass}`;
        const box = document.getElementById('result-card-box');
        box.style.borderColor = selectedFaction === 'Alliance' ? 'var(--alliance-blue)' : 'var(--horde-red)';
        switchStep('result');
    }

    function switchStep(stepId) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(`step-${stepId}`).classList.add('active');
    }

    function goBack(toStep) { switchStep(toStep); }
    function resetPoll() { switchStep('faction'); }

    function copyToDiscord() {
        const emoji = selectedFaction === 'Alliance' ? '🔵' : '🔴';
        const text = `**Faction:** ${emoji} ${selectedFaction}\n**Race:** ${selectedRace}\n**Class:** ${selectedClass}`;
        navigator.clipboard.writeText(text).then(() => {
            document.getElementById('success-text').style.display = 'block';
        });
    }
</script>
</body>
</html>
